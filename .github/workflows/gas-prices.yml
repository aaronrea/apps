name: Fetch gas prices

# The page is static and these origins send no CORS headers, so the browser
# cannot fetch them. This workflow is the fetching half of the app: it runs the
# scraper and commits the result, and the page just reads the committed file.
on:
  schedule:
    # Bradenton is UTC-4 in summer, UTC-5 in winter. Three times a day is
    # plenty for prices that move once a day, and it keeps the app inside the
    # 12-hour staleness window for all of the waking hours that matter — in
    # theory. In practice GitHub queues scheduled runs behind everyone else's
    # workflows, and it queues hardest at "round" minutes on the hour — :00,
    # :05, :10, :15 — which is exactly what these three used to be. Checked
    # against actual commit timestamps on 2026-09-13/14, the ~7am slot was
    # landing around 11am ET, ~4 hours late, which is why a pump-time check
    # at 8-9am was seeing the previous night's run and nothing fresher.
    #
    # Fix, round one: off-hour minutes (GitHub's own advice for reducing
    # queue delay), and the morning run moved earlier than it needs to be so
    # a multi-hour delay still lands it well before breakfast.
    #
    # Fix, round two (2026-09-17). Checked against the run history for
    # 09-11..09-17: the 07:37 UTC slot never fired at all — not late, dropped,
    # every single day — while the other two landed 1.5-3.5 hours late.
    # The storm workflow next door tells the same story: 8 slots a day, 4
    # runs. GitHub doesn't just delay schedules under load, it drops them,
    # and roughly half of what's asked for is what arrives. So the morning
    # gap was structural: one slot, always dropped, and prices sat 15+ hours
    # stale until the afternoon run. The answer is not a better minute but
    # more slots — every 2 hours — so that losing half of them still leaves
    # a run every ~4 hours, and the three morning slots (06:43, 08:43,
    # 10:43 UTC = 2:43, 4:43, 6:43am ET) give the commute several chances
    # to get a fresh number. Public repo, so Actions minutes are free, and
    # a dozen page fetches a day per station is nothing.
    - cron: '43 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race each other into a push conflict.
concurrency:
  group: gas-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The fetcher has no dependencies, so there is nothing to install.
      # It exits non-zero only when *every* adapter failed; it still writes a
      # coherent file in that case (everything carried forward as stale), so
      # let the commit happen either way and fail the job at the end.
      - name: Fetch prices
        id: fetch
        continue-on-error: true
        run: node gas-prices/scripts/fetch-prices.mjs

      - name: Check the comparison logic still holds
        run: node gas-prices/scripts/test-compare.mjs

      - name: Commit prices.json if it changed
        run: |
          set -euo pipefail

          if git diff --quiet -- gas-prices/data/prices.json; then
            echo "No price change — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gas-prices/data/prices.json
          git commit -m "Update gas prices"

          # A scheduled run can collide with a push to main; rebase and retry
          # rather than failing the run over it.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing on origin/${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done

          echo "Could not push after 3 attempts" >&2
          exit 1

      - name: Fail if nothing could be fetched
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Every adapter failed — prices.json holds stale data only." >&2
          exit 1
