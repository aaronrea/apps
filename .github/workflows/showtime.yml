name: Fetch movie showings

# filmsociety.org sends no CORS headers, so the browser can't read it. This
# workflow runs the scraper and commits showtime/data/movies.json, which the
# page and the landing card read. GitHub drops roughly half of scheduled
# slots under load (see gas-prices.yml), so ask more often than needed.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showtime
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Fetch movies
        run: node showtime/scripts/fetch-movies.mjs

      - name: Commit movies.json if it changed
        run: |
          set -euo pipefail

          if git diff --quiet -- showtime/data/movies.json; then
            echo "No change — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showtime/data/movies.json
          git commit -m "Update movie showings"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing on origin/${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done

          echo "Could not push after 3 attempts" >&2
          exit 1
